<!doctype html>
<!-- MARKETING DEMO ONLY: a tiny self-playing platformer to playtest in the 0.0.2.5 video. Every ~20 s the runner
     falls through one floor tile (the "bug" the voice report describes), then respawns. -->
<html><head><meta charset="utf-8"><title>Sky Ledge — playtest build 0.9.1</title>
<style>html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const T=48,SPEED=330,GRAV=2300,JUMP=-880;
let rnd=1;function r(){rnd=(rnd*16807)%2147483647;return rnd/2147483647}
// level: columns of ground height (in tiles from bottom), 0 = gap
const cols=[];function gen(n){while(cols.length<n){const last=cols.length?cols[cols.length-1]:3;
 if(cols.length>12&&r()<0.16&&last>0){const gl=2+((r()*2)|0);for(let i=0;i<gl;i++)cols.push(0);continue}
 let h=last>0?last:3;if(r()<0.25)h=Math.max(2,Math.min(6,h+(r()<0.5?-1:1)));const run=3+((r()*4)|0);for(let i=0;i<run;i++)cols.push(h)}}
gen(400);
const coins=new Set();for(let i=8;i<400;i+=1)if(cols[i]>0&&r()<0.35)coins.add(i);
let cam=0,px=0,py=0,vy=0,on=false,score=0,coinsN=0,t0=performance.now(),last=t0,glitch=-1,fallY=0,stars=[];
for(let i=0;i<140;i++)stars.push([Math.random(),Math.random()*0.7,Math.random()*1.6+0.4]);
function ground(i){return i<0?3:cols[i]||0}
function gy(i){const h=ground(i);return h?H-h*T:1e9}
function reset(){px=cam+W*0.3;const i=Math.floor(px/T);py=gy(i)-T;vy=0}
reset();
function step(dt,now){
 const tt=(now-t0)/1000;
 // the bug: from 10 s, every 20 s, for 6 s the runner sinks through the floor
 const ph=(tt-10)%20, glitching=tt>=10&&ph<6;
 if(glitching){glitch=ph;cam+=SPEED*dt*0.15;fallY=Math.min(fallY+60*dt,T*1.1);return}
 if(glitch>=0){glitch=-1;fallY=0;reset()}
 cam+=SPEED*dt;px=cam+W*0.3;
 const i=Math.floor((px+T/2)/T);
 // look ahead: jump before a gap or a step up
 const ahead=Math.floor((px+T*1.6)/T);
 if(on&&(ground(ahead)===0||ground(ahead)>ground(i))){vy=JUMP;on=false}
 vy+=GRAV*dt;py+=vy*dt;
 const floor=gy(i)-T;
 if(py>=floor&&vy>=0&&py-floor<T*0.9){py=floor;vy=0;on=true}else on=false;
 if(py>H+200)reset();
 const ci=Math.floor((px+T/2)/T);if(coins.has(ci)&&py<gy(ci)-T*0.5){coins.delete(ci);coinsN++;score+=50}
 score+=dt*10;
}
function draw(now){
 const tt=(now-t0)/1000;
 const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b1030');sky.addColorStop(1,'#2a1850');g.fillStyle=sky;g.fillRect(0,0,W,H);
 for(const s of stars){g.fillStyle='rgba(255,255,255,'+(0.35+0.35*Math.sin(tt*2+s[0]*20))+')';g.fillRect(((s[0]*W-cam*0.05)%W+W)%W,s[1]*H,s[2],s[2])}
 g.fillStyle='#1d2350';for(let k=0;k<8;k++){const x=((k*420-cam*0.25)%(8*420)+8*420)%(8*420)-420;g.beginPath();g.moveTo(x,H);g.lineTo(x+210,H*0.48);g.lineTo(x+420,H);g.fill()}
 g.fillStyle='#262c63';for(let k=0;k<10;k++){const x=((k*300-cam*0.45)%(3000)+3000)%3000-300;g.beginPath();g.moveTo(x,H);g.lineTo(x+150,H*0.62);g.lineTo(x+300,H);g.fill()}
 const i0=Math.floor(cam/T)-1,i1=i0+Math.ceil(W/T)+2;
 const bugCol=glitch>=0?Math.floor((px+T/2)/T):-99;
 for(let i=i0;i<=i1;i++){const h=ground(i);if(!h)continue;const x=i*T-cam;
  for(let k=0;k<h;k++){const y=H-(k+1)*T;g.fillStyle=k===h-1?'#3fd0c9':'#1b6f7a';g.fillRect(x,y,T-2,T-2);
   if(k===h-1){g.fillStyle='#8ff5ee';g.fillRect(x,y,T-2,6)}}
  if(i===bugCol){g.strokeStyle='#ff4d6d';g.lineWidth=4;g.setLineDash([8,6]);g.strokeRect(x+2,H-h*T+2,T-6,T-6);g.setLineDash([])}
  if(coins.has(i)){const cy=gy(i)-T*1.6+Math.sin(tt*4+i)*6;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(x+T/2,cy,12,15,0,0,7);g.fill();g.fillStyle='#fff3a8';g.fillRect(x+T/2-3,cy-8,4,12)}}
 // runner
 const sx=W*0.3,sy=py+fallY;
 g.save();if(glitch>=0){g.globalAlpha=0.6+0.4*Math.sin(tt*30)}
 g.fillStyle='#ff8a3d';g.fillRect(sx+4,sy+6,T-8,T-6);g.fillStyle='#ffd0a8';g.fillRect(sx+8,sy+6,T-16,8);
 g.fillStyle='#10131f';g.fillRect(sx+T-20,sy+18,7,9);g.fillRect(sx+T-32,sy+18,7,9);g.restore();
 if(glitch>=0){g.fillStyle='rgba(255,77,109,.9)';g.font='600 18px Consolas,monospace';g.fillText('y = '+(sy|0)+'  (below floor)',sx-10,sy-14)}
 // HUD
 g.fillStyle='rgba(8,10,24,.65)';g.fillRect(24,20,430,66);
 g.fillStyle='#fff';g.font='700 30px Segoe UI,sans-serif';g.fillText('SKY LEDGE',42,64);
 g.fillStyle='#9aa3c7';g.font='16px Segoe UI,sans-serif';g.fillText('World 3-2  ·  playtest 0.9.1',230,62);
 g.fillStyle='rgba(8,10,24,.65)';g.fillRect(W-300,20,276,66);
 g.fillStyle='#ffd23f';g.font='700 28px Consolas,monospace';g.fillText('◉ '+String(coinsN).padStart(2,'0'),W-280,64);
 g.fillStyle='#fff';g.fillText(String(score|0).padStart(6,'0'),W-160,64);
}
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;step(dt,now);draw(now);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
